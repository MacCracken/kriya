name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        run: |
          set -e
          # cyrius.cyml [package].cyrius pin is the single source of truth.
          # Upstream installer lays out $HOME/.cyrius/versions/<v>/ (the layout
          # `cyrius deps`/build's pin-check requires).
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Build (host + agnos)
        # Ship both the host build and the CYRIUS_TARGET_AGNOS build (the verbs
        # staged onto the agnos-fs /bin). ./lib/ is gitignored, so re-vendor first.
        run: |
          cyrius deps
          mkdir -p build
          cyrius build src/main.cyr build/kriya
          cyrius build --agnos src/main.cyr build/kriya_agnos

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/*
