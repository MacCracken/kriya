name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml [package].cyrius pin is the single source of truth
          # for the toolchain version — none is hardcoded here. Use the upstream
          # installer, which lays out $HOME/.cyrius/versions/<v>/ — the layout
          # `cyrius deps`/build's pin-check requires. (A hand-rolled curl+cp into
          # ~/.cyrius/{bin,lib} does NOT create the versioned path → pin check fails.)
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # The vendored ./lib/ snapshot is NOT committed (.gitignore) — re-vendor
        # it from the pinned toolchain before building.
        run: cyrius deps

      - name: Build (host + agnos)
        # kriya is now agnos-capable; build BOTH targets so a PR can't break the
        # CYRIUS_TARGET_AGNOS path undetected.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/kriya
          cyrius build --agnos src/main.cyr build/kriya_agnos

      - name: Test
        # Explicit .tcyr paths — the version-stable form across the 6.0.x line
        # (bare `cyrius test` stopped auto-discovering; `cyrius tests` postdates
        # the pin). Add new tcyr files here when they land.
        run: |
          cyrius test tests/kriya.tcyr
          cyrius test tests/kriya-posix.tcyr
