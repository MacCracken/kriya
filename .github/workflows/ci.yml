name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml [package].cyrius pin is the single source of truth
          # for the toolchain version — none is hardcoded here. Use the upstream
          # installer, which lays out $HOME/.cyrius/versions/<v>/ — the layout
          # `cyrius deps`/build's pin-check requires. (A hand-rolled curl+cp into
          # ~/.cyrius/{bin,lib} does NOT create the versioned path → pin check fails.)
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # The vendored ./lib/ snapshot is NOT committed (.gitignore) — re-vendor
        # it from the pinned toolchain before building.
        run: cyrius deps

      - name: Build (host + agnos)
        # kriya is now agnos-capable; build BOTH targets so a PR can't break the
        # CYRIUS_TARGET_AGNOS path undetected.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/kriya
          cyrius build --agnos src/main.cyr build/kriya_agnos

      - name: Test
        # Explicit .tcyr paths — the version-stable form across the 6.0.x line
        # (bare `cyrius test` stopped auto-discovering; `cyrius tests` postdates
        # the pin). Add new tcyr files here when they land.
        run: |
          cyrius test tests/kriya.tcyr
          cyrius test tests/kriya-posix.tcyr

      - name: Bench
        # ⛔ Not a timing gate — a COMPILE gate. `tests/kriya.bcyr` declares its
        # OWN include subset, separate from the two `.tcyr` files above, and
        # nothing in CI ever compiled it: at 1.6.0 it turned out not to have
        # built since v1.3.0, when `args.cyr` began routing `--help` through
        # `help.cyr` and left the bench short of `src/version_str.cyr` and
        # `src/lib/help.cyr`. Five releases, never red, because the Test step
        # names its two `.tcyr` files and stops there.
        # ⚠ `cyrius bench` exits non-zero on a compile error — that is the whole
        # signal wanted. The per-benchmark timings it prints are informational
        # and NOTHING asserts them: a hosted runner's numbers are not comparable
        # to a dev box's, so a timing gate here would flake rather than catch.
        run: cyrius bench tests/kriya.bcyr

      - name: Lint & vet
        # `lint` fails on an untracked deferral or a warning; `vet` on an
        # untrusted or missing dependency. Both were previously local-only,
        # which meant "clean at the release cut" rather than "clean on every PR".
        #
        # ⚠ cyrlint takes ONE FILE and does not follow includes, so this covers
        # `src/main.cyr` + `src/lib/` ONLY -- src/cmd/ is NOT linted here and a
        # green check does not mean the tree is clean. Those 38 files currently
        # carry 45 over-long lines and 59 untracked deferrals; bringing them in
        # is its own release (see roadmap, 1.3.x).
        run: |
          set -e
          for f in src/main.cyr src/lib/*.cyr; do
            echo "--- $f"
            cyrius lint "$f"
          done
          cyrius vet src/main.cyr

      - name: Lint deferral tracking (whole tree)
        # ⛔ `cyrius lint` takes ONE FILE and does not follow includes, so the
        # step above can only cover src/main.cyr + src/lib/. This runs it over
        # EVERY file including src/cmd/ — the 38 utilities, which had never been
        # linted and carried 56 untracked deferrals — and fails on any deferral
        # that does not name a roadmap or CHANGELOG entry, plus any roadmap
        # reference that points at an entry which does not exist.
        # ⭐ Both rules now: deferral tracking AND the 120-column limit. The
        # limit was reported-only until 1.3.8, when the 19 wrappable lines in
        # src/cmd/ turned out to be exactly that — wrappable — and the 29 that
        # are one long string literal got marked.
        run: sh scripts/lint-deferrals.sh

      - name: Lint the introspection interface
        # ⛔ The lint ADR 0002 promised. Checks that src/cmd/*.cyr, the
        # dispatcher table and `kriya --list` name the SAME utilities; that
        # every utility declares a complete `--help=json` document; and that
        # every k_write literal length matches its literal. Without this step
        # the check exists but nothing fails on it -- which is how an interface
        # rots silently.
        run: sh scripts/lint-help-schema.sh

      - name: Check oracle identity
        # ⛔ Every parity script resolves its GNU oracle by bare name through
        # $PATH and none of them check what they got. A BusyBox or toybox image
        # substitutes a different implementation for every oracle at once, and
        # the suite would not fail — it would pass against the wrong answer.
        # ⚠ Identity only; version differences are legitimate and unavoidable.
        run: sh scripts/check-oracles.sh

      - name: Smoke suite
        # ~3.5k behavioural cases across 37 scripts, ~11s. These are the tests
        # that actually compare kriya against GNU coreutils cell-by-cell; they
        # were written from v0.2.0 onward and had never run in CI.
        # ⚠ Runs every script and reports ALL failures rather than stopping at
        # the first, so one broken utility does not mask another.
        run: |
          set -e
          failed=""
          for s in scripts/smoke-*.sh; do
            echo "--- $s"
            if ! sh "$s"; then failed="$failed $s"; fi
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed" >&2
            exit 1
          fi

      - name: Fuzz (poisoned allocator)
        # ⚠ `cyrius fuzz` -- NOT `cyrius test`. Only the fuzz verb sets
        # CYRIUS_POISON=1, which turns on redzones and quarantine-on-free.
        # Without poison an out-of-bounds READ lands in mapped memory and never
        # faults, so a plain test run is silent about the failure class these
        # harnesses exist to catch.
        run: sh scripts/fuzz.sh
