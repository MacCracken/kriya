name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        # The vendored ./lib/ snapshot is NOT committed (.gitignore) — re-vendor
        # it from the pinned toolchain before building.
        run: cyrius deps

      - name: Build (host + agnos)
        # kriya is now agnos-capable; build BOTH targets so a PR can't break the
        # CYRIUS_TARGET_AGNOS path undetected.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/kriya
          cyrius build --agnos src/main.cyr build/kriya_agnos

      - name: Test
        # Explicit .tcyr paths — the version-stable form across the 6.0.x line
        # (bare `cyrius test` stopped auto-discovering; `cyrius tests` postdates
        # the pin). Add new tcyr files here when they land.
        run: |
          cyrius test tests/kriya.tcyr
          cyrius test tests/kriya-posix.tcyr
